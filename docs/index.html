<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapVault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container { max-width: 720px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px 32px; box-shadow: 0 2px 20px rgba(0,0,0,0.06); text-align: center; }
        h1 { font-size: 32px; margin-bottom: 8px; color: #1d1d1f; }
        .subtitle { color: #86868b; font-size: 17px; margin-bottom: 32px; }
        .links { display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto; }
        .links a { display: block; padding: 14px 24px; background: #007AFF; color: white; text-decoration: none; border-radius: 12px; font-size: 16px; font-weight: 600; transition: background 0.2s; }
        .links a:hover { background: #0056CC; }
        footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e5e5e7; color: #86868b; font-size: 13px; }
    </style>
</head>

    <div class="container">
        <h1>📸 SnapVault</h1>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="support.html">Support</a>
        </div>
        <footer>
            <p>SnapVault &copy; 2026. All rights reserved.</p>
